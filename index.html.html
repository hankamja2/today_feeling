<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 마음 날씨</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2b2724;--sub:#7a726b;--line:#e8e1d8;--accent:#e8805a;--sel:#fde9df;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b19;--card:#292623;--ink:#f2ede6;--sub:#a39a90;--line:#3b3631;--accent:#f09670;--sel:#4a3329;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1b19;--card:#292623;--ink:#f2ede6;--sub:#a39a90;--line:#3b3631;--accent:#f09670;--sel:#4a3329;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.date{color:var(--sub);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:24px}
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.m{border:2px solid transparent;background:var(--bg);border-radius:12px;padding:8px 0;cursor:pointer;font:inherit;color:var(--ink)}
.m .e{display:block;font-size:2rem;line-height:1.2}
.m .l{font-size:.75rem;color:var(--sub)}
.m[aria-pressed="true"]{border-color:var(--accent);background:var(--sel)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
textarea{resize:vertical;min-height:80px}
button.go{width:100%;font:inherit;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px;cursor:pointer}
button.go:disabled{opacity:.5;cursor:default}
#msg{color:var(--sub);font-size:.85rem;margin:8px 0 0;min-height:1.2em}
h2{font-size:1.1rem;margin:0 0 12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px}
.item .e{font-size:2rem;line-height:1}
.item .n{font-weight:600}
.item .d{color:var(--sub);font-size:.78rem;margin-left:6px;font-weight:400}
.item p{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
.empty{color:var(--sub);text-align:center;padding:20px}
</style>
</head>
<body>
<main>
<h1>오늘의 마음 날씨</h1>
<p class="date" id="today"></p>
<section class="card" id="form">
  <div class="moods" id="moods"></div>
  <input id="nick" maxlength="20" placeholder="이름">
  <textarea id="why" maxlength="300" placeholder="오늘 기분의 이유를 적어 보세요"></textarea>
  <button class="go" id="save" disabled>기록하기</button>
  <p id="msg"></p>
</section>
<h2>모두의 기분</h2>
<div id="feed"><div class="empty">불러오는 중…</div></div>
</main>
<script>
const MOODS=[["😄","최고예요"],["😊","좋아요"],["🥰","설레요"],["😌","평온해요"],["😐","그저 그래요"],["😴","피곤해요"],["😢","슬퍼요"],["😡","화나요"]];
const $=id=>document.getElementById(id);
const now=new Date();
const dayKey=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
$("today").textContent=now.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
let sel=null,db=null,uid=null;
MOODS.forEach(([e,l],i)=>{
  const b=document.createElement("button");b.className="m";b.setAttribute("aria-pressed","false");
  b.innerHTML='<span class="e"></span><span class="l"></span>';
  b.querySelector(".e").textContent=e;b.querySelector(".l").textContent=l;
  b.onclick=()=>{sel=i;[...$("moods").children].forEach((c,j)=>c.setAttribute("aria-pressed",j===i));check()};
  $("moods").appendChild(b);
});
function check(){$("save").disabled=!(db&&uid&&sel!==null)}
function render(snap){
  const rows=snap.docs.map(d=>d.data()).filter(r=>r&&MOODS[r.mood]).sort((a,b)=>(b.ts||0)-(a.ts||0));
  const feed=$("feed");feed.textContent="";
  if(!rows.length){feed.innerHTML='<div class="empty">아직 기록이 없어요. 첫 번째가 되어 보세요!</div>';return}
  rows.forEach(r=>{
    const it=document.createElement("div");it.className="item";
    const e=document.createElement("div");e.className="e";e.textContent=MOODS[r.mood][0];
    const box=document.createElement("div");
    const n=document.createElement("div");n.className="n";
    n.textContent=r.nick||"익명";
    const d=document.createElement("span");d.className="d";d.textContent=(r.day===dayKey?"오늘":r.day||"")+" · "+MOODS[r.mood][1];
    n.appendChild(d);
    const p=document.createElement("p");p.textContent=r.why||"";
    box.append(n,p);it.append(e,box);feed.appendChild(it);
  });
}
try{localStorage.getItem("x");$("nick").value=localStorage.getItem("nick")||""}catch(e){}
(async()=>{
  try{
    const user=await claude.use("user");db=await claude.use("db");
    if(!db||!user){$("feed").innerHTML='<div class="empty">로그인하면 기록을 보고 쓸 수 있어요.</div>';return}
    uid=await user.id();check();
    const timer=setTimeout(()=>{$("feed").innerHTML='<div class="empty">불러오지 못했어요. 새로고침해 주세요.</div>'},10000);
    db.collection("moods").onSnapshot(s=>{clearTimeout(timer);render(s)},e=>{clearTimeout(timer);$("feed").innerHTML='<div class="empty">불러오지 못했어요.</div>'});
    const mine=await db.doc("moods/"+uid).get();
    if(mine.exists){const m=mine.data();if(m.day===dayKey&&MOODS[m.mood]){$("moods").children[m.mood].click();$("why").value=m.why||"";$("nick").value=m.nick||$("nick").value;$("msg").textContent="오늘 기록이 있어요. 수정하면 덮어써져요."}}
  }catch(e){$("feed").innerHTML='<div class="empty">불러오지 못했어요.</div>'}
})();
$("save").onclick=async()=>{
  $("save").disabled=true;$("msg").textContent="저장 중…";
  const nick=$("nick").value.trim()||"익명";
  try{localStorage.setItem("nick",nick)}catch(e){}
  try{
    await db.doc("moods/"+uid).set({mood:sel,why:$("why").value.trim(),nick,day:dayKey,ts:Date.now()});
    $("msg").textContent="기록했어요! 오늘도 수고했어요 ☺️";
  }catch(e){$("msg").textContent="저장하지 못했어요. 권한을 확인해 주세요."}
  check();
};
</script>
</body>
</html>
